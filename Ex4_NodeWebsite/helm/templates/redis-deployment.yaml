apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.redis.name }}
  namespace: {{ .Values.namespace.name }}

  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis

spec:
  replicas: 1

  selector:
    matchLabels:
      {{- include "devops-app.redisSelectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "devops-app.redisSelectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: redis

          image: >-
            {{ .Values.redis.image.repository }}:
            {{- .Values.redis.image.tag }}

          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}

          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}
              protocol: TCP

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping

            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}