apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.redisService.name }}
  namespace: {{ .Values.namespace.name }}

  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis

spec:
  type: {{ .Values.redisService.type }}

  selector:
    {{- include "devops-app.redisSelectorLabels" . | nindent 4 }}

  ports:
    - name: redis
      protocol: TCP
      port: {{ .Values.redisService.port }}
      targetPort: {{ .Values.redisService.targetPort }}